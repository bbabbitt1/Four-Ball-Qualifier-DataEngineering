version: 2

seeds:
  - name: pro_experience
    description: >
      Generated by pro.py: entrants whose name matches a pgatour.com tour player, with career starts per tour.
      Name-only match, so is_match is set by hand (y = same person, n = namesake). Blank = unreviewed, not counted.
    columns:
      - name: is_match
        data_tests:
          - accepted_values:
              arguments: {values: ['y', 'n']}
